{{define "body"}}
<div class="main">
    <div id="loading">
        <i class="fa fa-spinner fa-spin fa-4x"></i>
    </div>
    <div style="display:none;" id="campaignResults">
        <div class="row">
            <h1 class="page-header" id="page-title">Results for campaign.name</h1>
        </div>
        <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
            <a href="/campaigns" class="btn btn-secondary">
                <i class="fa fa-arrow-circle-o-left fa-lg"></i> Back
            </a>
            <div class="btn-group">
                <button type="button" id="exportButton" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown"
                    aria-haspopup="true" aria-expanded="true">
                    <i class="fa fa-file-excel-o"></i> Export CSV
                    <i class="fa fa-caret-down"></i>
                </button>
                <ul class="dropdown-menu" aria-labelledby="exportButton">
                    <li>
                        <a class="dropdown-item" href="#" onclick="exportAsCSV('results')">Results</a>
                    </li>
                    <li>
                        <a class="dropdown-item" href="#" onclick="exportAsCSV('events')">Raw Events</a>
                    </li>
                </ul>
            </div>
            {{if .ModifyObjects}}
            <button id="complete_button" type="button" class="btn btn-blue" data-bs-toggle="tooltip" onclick="completeCampaign()">
                <i class="fa fa-flag-checkered"></i> Complete
            </button>
            <button id="resend_failed_button" type="button" class="btn btn-warning" data-bs-toggle="tooltip" onclick="resend_all_failed(campaign.id)">
                <i class="fa fa-repeat"></i> Resend Failed
            </button>
            <button type="button" class="btn btn-danger" data-bs-toggle="tooltip" onclick="deleteCampaign()">
                <i class="fa fa-trash-o fa-lg"></i> Delete
            </button>
            {{end}}
            <button id="refresh_btn" type="button" class="btn btn-blue" data-bs-toggle="tooltip" onclick="refresh()">
                <i class="fa fa-refresh fa-lg"></i> Refresh
            </button>
            <span id="refresh_message">
                <i class="fa fa-spin fa-spinner"></i> Refreshing
            </span>
        </div>
        <br />
        <div class="row">
            <div class="col-lg-12 col-md-12 col-sm-12 col-12">
                <div class="row">
                    <div class="col-lg-12 col-md-12 col-sm-12 col-12">
                        <div id="timeline_chart"></div>
                    </div>
                </div>
                <div class="row">
                    <div style="height:200px;" class="col-lg-1 col-md-1"></div>
                    <div id="sent_chart" style="height:200px;" class="col-lg-2 col-md-2"></div>
                    <div id="opened_chart" style="height:200px;" class="col-lg-2 col-md-2"></div>
                    <div id="clicked_chart" style="height:200px;" class="col-lg-2 col-md-2"></div>
                    <div id="submitted_data_chart" style="height:200px;" class="col-lg-2 col-md-2"></div>
                    <div id="reported_chart" style="height:200px;" class="col-lg-2 col-md-2"></div>
                    <div style="height:200px;" class="col-lg-1 col-md-1"></div>
                </div>
                <div class="row" id="resultsMapContainer">
                    <div class="col-md-6">
                        <p style="text-align:center;">Targets Map</p>
                        <div id="resultsMap"></div>
                    </div>
                </div>
            </div>
        </div>
        <h2 class="mb-3">Details</h2>
        <div class="card">
            <div class="card-body">
                <table id="resultsTable" class="table">
                    <thead>
                        <tr>
                            <th>Result ID</th>
                            <th class="no-sort"></th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Email</th>
                            <th>Position</th>
                            <th>Status</th>
                            <th class="text-center">Reported</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div id="flashes" class="row"></div>
</div>
{{end}} {{define "scripts"}}
<script src="/js/dist/world-map.js"></script>
<script src="/js/dist/app/campaign_results.min.js"></script>
{{end}}
